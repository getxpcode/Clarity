<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clarify</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">Clarify</div>

        <nav>
            <a href="#">Home</a>
            <a href="#">History</a>
        </nav>
    </header>


    <main>

        <section class="hero">

            <p class="small-title">CLARIFY YOUR INFORMATION</p>

            <h1>
                Turn long text into
                <span>clear ideas.</span>
            </h1>

            <p class="description">
                Paste your text below and Clarify will extract
                the most important information for you.
            </p>

        </section>


        <section class="summarizer">

            <div class="input-box">

                <div class="box-header">
                    <h2>Your text</h2>
                    <span id="wordCount">0 words</span>
                </div>

                <textarea
                    id="textInput"
                    placeholder="Paste your long text here..."
                ></textarea>

                <button id="clarifyButton">
                    Clarify text →
                </button>

            </div>


            <div class="result-box">

                <div class="box-header">
                    <h2>Summary</h2>
                    <span id="sentenceCount"></span>
                </div>

                <div id="summary">
                    <p class="placeholder">
                        Your summary will appear here.
                    </p>
                </div>

            </div>

        </section>

    </main>


    <footer>
        <p>Clarify — Make information easier to understand.</p>
    </footer>


    <script src="script.js"></script>

</body>
</html>
